<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YMCA Result Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 50px;
        }
        .container {
            width: 300px;
            margin: auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 10px;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.1);
        }
        .captcha {
            font-weight: bold;
            font-size: 20px;
            margin: 10px 0;
        }
        .error {
            color: red;
            font-size: 12px;
        }
        .disclaimer {
            color: red;
            font-size: 14px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Check Your Result</h2>
        <form id="resultForm">
            <label for="roll">Roll No</label>
            <input type="text" id="roll" name="roll" required><br><br>
            
            <label for="semester">Semester</label>
            <select id="semester" name="semester" required>
                <option value="">--Select--</option>
                <option value="1">Semester 1</option>
                <option value="2">Semester 2</option>
                <option value="3">Semester 3</option>
                <option value="4">Semester 4</option>
                <option value="5">Semester 5</option>
                <option value="6">Semester 6</option>
                <option value="7">Semester 7</option>
                <option value="8">Semester 8</option>
            </select><br><br>
            
            <div class="captcha">RA7N2M</div>
            <label for="captcha">Enter Captcha</label>
            <input type="text" id="captcha" name="captcha" required><br><br>
            
            <button type="button" onclick="checkResult()">View Result</button>
            <p class="error" id="error"></p>
        </form>
        <p class="disclaimer">**The Results displayed here are subject to updation/correction. The final result will be on DMC.</p>
    </div>

    <script>
        function checkResult() {
            var roll = document.getElementById("roll").value;
            var semester = document.getElementById("semester").value;
            var captcha = document.getElementById("captcha").value;
            var error = document.getElementById("error");
            
            if (roll !== "23011018055") {
                error.textContent = "Invalid Roll Number";
                return;
            }
            
            if (captcha !== "RA7N2M") {
                error.textContent = "Incorrect Captcha";
                return;
            }
            
            if (semester === "1") {
                window.location.href = "semester1.html";
            } else if (semester === "2") {
                window.location.href = "semester2.html";
            } else {
                error.textContent = "Please select a semester";
            }
        }
    </script>
</body>
</html>
